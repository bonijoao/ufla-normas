title: UFLA Normas 6ª edição
author: UFLA Template Community
version: 1.0.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    pdf:
      template: template.tex
      pdf-engine: lualatex
      lang: pt-BR
      # citeproc (Pandoc) with the bundled ABNT/UFLA style; "#" headings
      # are chapters, so numbering starts at "1 INTRODUÇÃO"
      csl: ufla-abnt.csl
      top-level-division: chapter
      # Order matters: referencias.lua cleans the bibliography (and marks
      # missing keys) before citacoes.lua reads it; Quarto runs citeproc
      # after all of these
      filters:
        - filtros/referencias.lua
        - filtros/citacoes.lua
        - filtros/tipo.lua
      keep-tex: false
      date-format: "YYYY"
      toc: false
      number-sections: false
      # Default UFLA metadata (users override these at document level).
      # tipo.lua fills the nota descritiva from `tipo` (empty = dissertacao);
      # tipo-trabalho/titulo-pretendido/genero override the preset
      tipo: ""
      tipo-trabalho: ""
      genero: ""
      titulo-pretendido: ""
      curso: ""
      area-concentracao: ""
      orientador: ""
      orientadora: ""
      orientador-genero: ""
      coorientador: ""
      coorientadora: ""
      coorientador-genero: ""
      cidade: "Lavras-MG"
      ano: ""
      instituicao: "Universidade Federal de Lavras"
      frente-verso: false
      ficha-catalografica: false
      indicadores-impacto: true
      # Banca members (optional)
      banca-um-nome: ""
      banca-um-inst: ""
      banca-dois-nome: ""
      banca-dois-inst: ""
      banca-tres-nome: ""
      banca-tres-inst: ""
      banca-quatro-nome: ""
      banca-quatro-inst: ""
      defesa: ""
      # Optional pre-textual elements
      dedicatoria: ""
      agradecimentos: ""
      epigrafe: ""
      epigrafe-autor: ""
      abstract-en: ""
      keywords-en: ""
      indicadores-impacto-texto: ""
      impact-indicators-texto: ""
      # Ficha catalografica fields (used only when ficha-catalografica: true)
      fc-autor-sobrenome: ""
      fc-autores: ""
      fc-tipo: ""
      fc-catalogacao: ""
      fc-classificacao: ""
      fc-ilust: "il."
