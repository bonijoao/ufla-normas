title: UFLA Normas 6ª edição
author: UFLA Template Community
version: 1.0.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    pdf:
      template: template.tex
      pdf-engine: lualatex
      lang: pt-BR
      # citeproc (Pandoc) with the bundled ABNT/UFLA style; "#" headings
      # are chapters, so numbering starts at "1 INTRODUÇÃO"
      csl: ufla-abnt.csl
      top-level-division: chapter
      # Order matters: validar.lua checks the YAML first (and stops on a
      # missing bibliography file or unknown tipo); referencias.lua cleans
      # the bibliography (and marks missing keys) before citacoes.lua reads
      # it; elementos.lua comes last, after referencias.lua has handled the
      # author's own "Referências" heading and #refs div, so it can move
      # #refs before the apêndices; Quarto runs citeproc after all of these
      filters:
        - filtros/validar.lua
        - filtros/referencias.lua
        - filtros/citacoes.lua
        - filtros/tipo.lua
        - filtros/elementos.lua
      # Quadros: ::: {#qdr-x} ... ::: with @qdr-x references (elementos.lua
      # adds the `quadro="Legenda"` and `fonte="..."` attributes)
      crossref:
        custom:
          - kind: float
            key: qdr
            reference-prefix: Quadro
            caption-location: top
            latex-env: quadro
            latex-list-of-file-extension: loq
            latex-list-of-description: Quadros
      # Title above figures and tables, source below (manual 3.2.9/3.2.10)
      fig-cap-location: top
      tbl-cap-location: top
      keep-tex: false
      date-format: "YYYY"
      toc: false
      number-sections: false
      # Default UFLA metadata (users override these at document level).
      # tipo.lua fills the nota descritiva from `tipo` (empty = dissertacao);
      # tipo-trabalho/titulo-pretendido/genero override the preset
      tipo: ""
      tipo-trabalho: ""
      genero: ""
      titulo-pretendido: ""
      curso: ""
      area-concentracao: ""
      orientador: ""
      orientadora: ""
      orientador-genero: ""
      coorientador: ""
      coorientadora: ""
      coorientador-genero: ""
      cidade: "Lavras-MG"
      ano: ""
      instituicao: "Universidade Federal de Lavras"
      frente-verso: false
      ficha-catalografica: false
      indicadores-impacto: true
      # Banca members (optional)
      banca-um-nome: ""
      banca-um-inst: ""
      banca-dois-nome: ""
      banca-dois-inst: ""
      banca-tres-nome: ""
      banca-tres-inst: ""
      banca-quatro-nome: ""
      banca-quatro-inst: ""
      defesa: ""
      # Optional pre-textual elements
      dedicatoria: ""
      agradecimentos: ""
      epigrafe: ""
      epigrafe-autor: ""
      abstract-en: ""
      keywords-en: ""
      indicadores-impacto-texto: ""
      impact-indicators-texto: ""
      # Ficha catalografica fields (used only when ficha-catalografica: true)
      fc-autor-sobrenome: ""
      fc-autores: ""
      fc-tipo: ""
      fc-catalogacao: ""
      fc-classificacao: ""
      fc-ilust: "il."
